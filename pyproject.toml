[project]
name = "llm-decode-kernels"
version = "0.1.0"
description = "Triton and CUDA kernels for LLM decoding, benchmarked on L4 and H100."
requires-python = ">=3.11"
license = { text = "MIT" }

# Local tooling only. GPU code runs inside the Modal image (see modal_app.py),
# CPU kernel tests run inside docker/Dockerfile.cpu.
[project.optional-dependencies]
local = [
  "modal==1.6.3",
  "matplotlib>=3.9",
  "plotly>=5.24",
  "numpy>=2.0",
  "ruff>=0.8",
  "pytest>=8.3",
  "playwright>=1.48",
  "pillow>=11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kernels*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
# Triton kernels use short math names and constexpr arguments.
"kernels/*.py" = ["E741", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU (skipped on CPU)",
  "slow: larger shapes, skipped in the interpreter",
]
